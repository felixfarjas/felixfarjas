plugins {
    id 'com.android.application'
}

android {
    namespace 'com.felixfarjas.boucan'
    compileSdk 35

    defaultConfig {
        applicationId 'com.felixfarjas.boucan'
        minSdk 21
        targetSdk 35
        versionCode 12
        versionName '2.1'
    }

    // L'app web (../web) est embarquée telle quelle dans les assets.
    sourceSets {
        main {
            assets.srcDirs = ['../../web']
        }
    }

    // Clé d'installation directe (APK hors Play Store). Elle est publique :
    // elle sert seulement à ce que les mises à jour s'installent par-dessus
    // l'ancienne version. Pour le Play Store, utiliser une clé privée.
    signingConfigs {
        sideload {
            storeFile file('../boucan-sideload.keystore')
            storePassword 'boucan'
            keyAlias 'boucan'
            keyPassword 'boucan'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.sideload
        }
        debug {
            signingConfig signingConfigs.sideload
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
