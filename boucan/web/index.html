<!doctype html>
<html lang="fr">
<head>

<meta name="theme-color" content="#000000">
<title>Boucan</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="editBtn" class="tbtn"><span id="editLbl">ÉDIT</span></div>

  <div id="grid"></div>
  <div id="tabs"></div>
</div>
<div id="toast"></div>
<div id="busy"><div id="busyTxt">BOUCAN</div></div>
<input type="file" id="fileAudio" accept="audio/*">

<script src="js/i18n.js"></script>
<script src="js/synth.js"></script>
<script src="js/core.js"></script>
